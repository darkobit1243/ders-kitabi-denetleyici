# Proje tamamen yerel çalışır.
[browser]
# Streamlit'in kullanım istatistiği göndermesini kapatır
gatherUsageStats = false

[server]
# Yalnızca bu bilgisayardan erişilebilir (ağdaki diğer bilgisayarlar erişemez)
address = "localhost"
port = 8501
maxUploadSize = 500

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#12315f"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#eef2f8"
textColor = "#1a202c"
